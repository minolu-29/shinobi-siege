<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Tamahagane Forge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Zen+Antique&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: a single forge scene on canvas; menus are wooden boards and washi order slips that slide over the glowing hearth */
:root{
  --soot:#14100d; --soot2:#1e1813; --wood:#2a2019; --wood2:#3a2c21; --plank:#4a3829;
  --ember:#ff7a2f; --ember2:#ffb15c; --gold:#d9a84b; --gold2:#f3d48a;
  --washi:#efe5cf; --washi2:#dfd2b4; --ink:#1b1510; --ink2:#5a4c3c;
  --steel:#b9c1c9; --indigo:#22304d; --shu:#c13f2b; --shu2:#7d2416; --moss:#6f9a52;
  --f-kanji:'Zen Antique','Hiragino Mincho ProN','Yu Mincho',serif;
  --f-disp:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--soot);color:var(--washi)}
body{font:14px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0;overflow:hidden;background:var(--soot)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:2px solid var(--ember2);outline-offset:2px}
button:disabled{cursor:default;opacity:.45}
input{font:inherit}

.screen{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding-block:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 24px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen.dim{background:linear-gradient(180deg,rgba(14,10,8,.86),rgba(14,10,8,.94))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

/* title */
#scr-title{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;gap:10px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 8vh)}
.t-kanji{font-family:var(--f-kanji);font-size:clamp(64px,19vw,120px);line-height:1;letter-spacing:.06em;color:var(--washi);text-shadow:0 0 30px rgba(255,122,47,.45),0 6px 0 rgba(0,0,0,.4)}
.t-en{font-family:var(--f-disp);font-weight:700;font-size:clamp(40px,12vw,72px);line-height:.85;letter-spacing:.12em;color:var(--gold2);text-transform:uppercase}
.t-sub{font-family:var(--f-disp);font-weight:600;letter-spacing:.4em;font-size:15px;color:var(--ember2);text-transform:uppercase}
.t-tag{max-width:32ch;opacity:.85;text-wrap:balance}
@media (min-aspect-ratio:1/1){#scr-title{background:radial-gradient(ellipse 42% 58% at 50% 74%,rgba(14,10,8,.78),rgba(14,10,8,0) 72%)}.t-sub,.t-tag{text-shadow:0 1px 3px #000,0 0 14px #000,0 0 6px #000}.t-tag{opacity:.95}}
.btn-main{font-family:var(--f-disp);font-weight:700;font-size:28px;letter-spacing:.12em;line-height:1;white-space:nowrap;padding:12px 34px 10px;border-radius:4px;color:#2a1306;
  background:linear-gradient(180deg,var(--ember2),var(--ember));box-shadow:0 4px 0 #8a3a12,0 0 28px rgba(255,122,47,.45)}
.btn-main:active{transform:translateY(3px);box-shadow:0 1px 0 #8a3a12}
.chip{font-size:13px;padding:8px 14px;border-radius:999px;background:rgba(239,229,207,.08);border:1px solid rgba(239,229,207,.18)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}.row.center{justify-content:center}

/* topbar */
.top{display:flex;align-items:center;gap:10px}
.rank{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.seal{width:46px;height:46px;flex:none;border-radius:6px;background:var(--shu);color:var(--washi);display:grid;place-items:center;font-family:var(--f-kanji);font-size:19px;line-height:1;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25),0 3px 0 var(--shu2)}
.rank-txt{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.rank-txt b{font-family:var(--f-disp);font-size:20px;letter-spacing:.06em;line-height:1;font-weight:700;text-transform:uppercase}
.bar{height:6px;border-radius:3px;background:rgba(239,229,207,.12);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ember),var(--gold2))}
.rank-txt span{font-size:11px;opacity:.65;font-variant-numeric:tabular-nums}
.money{font-family:var(--f-disp);font-weight:700;font-size:24px;line-height:1;color:var(--gold2);display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.mon{width:16px;height:16px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fff1bd,var(--gold) 55%,#8a6418);position:relative}
.mon::after{content:"";position:absolute;left:5.5px;top:5.5px;width:5px;height:5px;background:rgba(30,20,8,.75)}
.ibtn{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;background:rgba(239,229,207,.08);font-family:var(--f-kanji);font-size:17px}

/* home */
#scr-home{display:flex;flex-direction:column;justify-content:space-between}
.home-bottom{max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.stock{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:12.5px}
.stock span{background:rgba(20,16,13,.75);border:1px solid rgba(217,168,75,.35);border-radius:999px;padding:4px 12px;display:flex;align-items:center;gap:6px}
.stock b{font-family:var(--f-disp);font-size:17px;line-height:1;color:var(--gold2)}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.act{background:linear-gradient(180deg,var(--wood2),var(--wood));border:1px solid rgba(217,168,75,.28);border-radius:8px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.act b{font-family:var(--f-kanji);font-size:26px;line-height:1.1;color:var(--ember2);font-weight:400}
.act span{font-family:var(--f-disp);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;line-height:1.1;text-align:center}
.act em{position:absolute;top:-6px;right:-4px;font-style:normal;font-size:11px;font-weight:700;background:var(--shu);border-radius:999px;padding:1px 7px}
.act.big{grid-column:span 2;flex-direction:row;justify-content:center;gap:12px;background:linear-gradient(180deg,#6b3418,#4a2410);border-color:rgba(255,177,92,.55)}
.act.big b{font-size:34px;color:var(--gold2)}
.act.big span{font-size:20px;text-align:left}
.act.big small{display:block;font-family:var(--f-body);font-size:11px;letter-spacing:0;text-transform:none;opacity:.75;font-weight:500}

/* section headers & cards */
.hd{display:flex;align-items:baseline;gap:10px;margin-top:4px}
.hd h2{margin:0;font-family:var(--f-disp);font-weight:700;font-size:28px;letter-spacing:.08em;line-height:1;text-transform:uppercase}
.hd span{font-family:var(--f-kanji);color:var(--ember2);font-size:17px}
.note{font-size:12.5px;opacity:.75;margin:0;text-wrap:pretty}
.board{background:linear-gradient(180deg,var(--wood2),var(--wood));border:1px solid rgba(217,168,75,.22);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.board h3{margin:0;font-family:var(--f-disp);font-size:19px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:baseline;gap:8px}
.board h3 small{font-family:var(--f-kanji);font-size:14px;color:var(--ember2);letter-spacing:0;text-transform:none;font-weight:400}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.opt{border:1.5px solid rgba(239,229,207,.18);border-radius:6px;padding:8px 8px 7px;text-align:left;background:rgba(0,0,0,.18);display:flex;flex-direction:column;gap:1px;min-width:0}
.opt b{font-family:var(--f-kanji);font-weight:400;font-size:18px;line-height:1.2;color:var(--washi)}
.opt span{font-size:11.5px;opacity:.75;line-height:1.3}
.opt[aria-pressed="true"]{border-color:var(--ember2);background:rgba(255,122,47,.16);box-shadow:inset 0 0 0 1px var(--ember2)}
.opt.lock{opacity:.4}
.slider{display:flex;flex-direction:column;gap:4px}
.slider label{display:flex;justify-content:space-between;font-size:12.5px}
.slider label b{font-family:var(--f-disp);font-size:17px;color:var(--gold2);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--ember)}
.meter{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 10px;align-items:center;font-size:12.5px}
.meter .bar{height:8px}
.meter b{font-family:var(--f-disp);font-size:16px;font-variant-numeric:tabular-nums;color:var(--gold2)}
.cost{display:flex;align-items:center;gap:6px;font-family:var(--f-disp);font-size:22px;font-weight:700;color:var(--gold2)}
.btn{font-family:var(--f-disp);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:17px;padding:10px 16px 8px;border-radius:5px;line-height:1}
.btn.go{background:linear-gradient(180deg,var(--ember2),var(--ember));color:#2a1306;box-shadow:0 3px 0 #8a3a12}
.btn.ink{background:var(--washi);color:var(--ink);box-shadow:0 3px 0 #9d8f72}
.btn.ghost{border:1.5px solid rgba(239,229,207,.4)}
.btn.ad{border:1.5px dashed var(--gold);color:var(--gold2)}
.btn:active{transform:translateY(2px)}
.back{font-family:var(--f-kanji);font-size:17px}

/* slips (orders) */
.slip{background:var(--washi);color:var(--ink);border-radius:3px;padding:12px 14px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:4px 12px;box-shadow:0 8px 18px rgba(0,0,0,.35);
  background-image:repeating-linear-gradient(96deg,rgba(120,90,40,.04) 0 2px,transparent 2px 7px)}
.slip .who{grid-row:span 2;width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--washi);display:grid;place-items:center;font-family:var(--f-kanji);font-size:19px}
.slip h4{margin:0;font-family:var(--f-disp);font-size:20px;letter-spacing:.04em;line-height:1.1}
.slip p{margin:0;font-size:12.5px;color:var(--ink2)}
.slip .req{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px}
.slip .req b{color:var(--ink)}
.slip .foot{grid-column:1/-1;display:flex;align-items:center;gap:8px;border-top:1px dashed rgba(27,21,16,.25);padding-top:8px;margin-top:4px}
.slip .pay{font-family:var(--f-disp);font-weight:700;font-size:22px;margin-right:auto;display:flex;align-items:center;gap:6px}
.slip .btn.go{font-size:15px}

/* blades list */
.blades{display:flex;flex-direction:column;gap:8px}
.bl{color:var(--washi);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;background:linear-gradient(180deg,var(--wood2),var(--wood));border:1px solid rgba(217,168,75,.22);border-radius:8px;padding:8px 10px;align-items:center}
.bl img{grid-column:1/-1;width:100%;height:auto;display:block;border-radius:4px;background:#0f0c0a}
.bl .nm{display:flex;flex-direction:column;min-width:0}
.bl .nm b{font-family:var(--f-kanji);font-weight:400;font-size:17px}
.bl .nm span{font-size:11.5px;opacity:.75}
.grade{display:inline-grid;place-items:center;font-family:var(--f-kanji);font-size:13px;color:#fff;border-radius:4px;padding:3px 7px 2px;line-height:1.2}
.bl.pick{outline:2px solid transparent;cursor:pointer}
.bl.pick:hover{outline-color:var(--ember2)}

/* upgrades */
.up{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;background:linear-gradient(180deg,var(--wood2),var(--wood));border:1px solid rgba(217,168,75,.22);border-radius:8px;padding:10px 12px}
.up .k{width:48px;height:48px;border-radius:8px;background:#120e0b;display:grid;place-items:center;font-family:var(--f-kanji);font-size:24px;color:var(--ember2);position:relative}
.up .k i{position:absolute;bottom:-6px;right:-6px;font-style:normal;font-family:var(--f-disp);font-weight:700;font-size:14px;background:var(--gold);color:#2a1a06;border-radius:3px;padding:2px 5px 0;line-height:1}
.up h4{margin:0;font-family:var(--f-disp);font-size:19px;letter-spacing:.04em;line-height:1.1}
.up p{margin:2px 0 0;font-size:12px;opacity:.75}
.pips{display:flex;gap:3px;margin-top:5px}.pips i{width:14px;height:4px;border-radius:2px;background:rgba(239,229,207,.15)}.pips i.on{background:var(--ember2)}
.up .btn{font-size:15px;padding:9px 12px 7px;display:flex;align-items:center;gap:5px}

/* minigame HUD */
#hud{position:absolute;inset:0;pointer-events:none}
.hud-top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.hud-step{display:flex;align-items:baseline;gap:10px;background:rgba(14,10,8,.7);padding:6px 14px 4px;border-radius:999px;border:1px solid rgba(217,168,75,.3)}
.hud-step b{font-family:var(--f-kanji);font-weight:400;font-size:20px;color:var(--ember2)}
.hud-step span{font-family:var(--f-disp);font-weight:600;font-size:17px;letter-spacing:.08em;text-transform:uppercase}
.hud-prog{width:min(320px,70vw);height:5px;border-radius:3px;background:rgba(239,229,207,.15);overflow:hidden}
.hud-prog i{display:block;height:100%;background:var(--ember2);transform-origin:left}
.hud-info{font-size:13px;font-weight:700;text-shadow:0 1px 3px #000;min-height:1.4em;background:rgba(14,10,8,.7);padding:4px 12px;border-radius:999px;max-width:100%}.hud-info:empty{background:none}
#mgCtl{position:absolute;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;gap:10px;justify-content:center;pointer-events:auto}
.mb{min-width:96px;padding:14px 16px 11px;border-radius:10px;font-family:var(--f-disp);font-weight:700;font-size:19px;letter-spacing:.06em;text-transform:uppercase;line-height:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:linear-gradient(180deg,var(--wood2),var(--wood));border:1.5px solid rgba(217,168,75,.45);box-shadow:0 5px 0 #120d0a,0 10px 20px rgba(0,0,0,.5);touch-action:none}
.mb b{font-family:var(--f-kanji);font-weight:400;font-size:24px;color:var(--ember2);line-height:1}
.mb.hot{background:linear-gradient(180deg,#8a3e16,#5a260c);border-color:var(--ember2)}
.mb.glow{animation:glow .6s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 5px 0 #120d0a,0 0 0 6px rgba(255,177,92,.45)}}
.mb.big{min-width:150px;padding:18px 22px 14px;font-size:22px}
.mb:active,.mb.down{transform:translateY(3px);box-shadow:0 2px 0 #120d0a}

/* intro card & modal */
.modal{position:absolute;inset:0;background:rgba(8,6,4,.72);display:grid;place-items:center;z-index:30;overflow-y:auto;
  padding-block:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{width:100%;max-width:420px;background:var(--washi);color:var(--ink);border-radius:4px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 50px rgba(0,0,0,.5);animation:rise .22s ease-out;
  background-image:repeating-linear-gradient(96deg,rgba(120,90,40,.04) 0 2px,transparent 2px 7px)}
@keyframes rise{from{transform:translateY(12px);opacity:.4}}
.card .bigk{font-family:var(--f-kanji);font-size:54px;line-height:1;color:var(--shu)}
.card h3{margin:0;font-family:var(--f-disp);font-size:28px;letter-spacing:.05em;line-height:1;text-transform:uppercase}
.card h3 small{display:block;font-family:var(--f-kanji);font-size:15px;color:var(--ink2);text-transform:none;letter-spacing:0;margin-top:4px}
.card p{margin:0;font-size:13.5px;line-height:1.6;color:#3a2f24}
.card .how{background:rgba(27,21,16,.07);border-left:3px solid var(--shu);padding:8px 10px;font-size:13px;font-weight:700}
.card .btn.ghost{border-color:rgba(27,21,16,.45);color:var(--ink)}
.card input[type=text]{width:100%;padding:10px 12px;border-radius:4px;border:1.5px solid rgba(27,21,16,.35);background:#fffaf0;color:var(--ink);font-size:16px}
.res-k{font-family:var(--f-kanji);font-size:48px;line-height:1;text-align:center}
.score{font-family:var(--f-disp);font-weight:700;font-size:44px;line-height:1;text-align:center}

/* appraisal */
#scr-appr{display:flex;flex-direction:column;justify-content:flex-end}
.appr{max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.appr-head{display:flex;align-items:center;gap:12px}
.stamp{width:74px;height:74px;flex:none;border:3px solid var(--shu);color:var(--shu);border-radius:8px;display:grid;place-items:center;font-family:var(--f-kanji);font-size:24px;line-height:1.05;text-align:center;transform:rotate(-6deg);background:rgba(239,229,207,.08);padding:4px}
.appr-head h3{margin:0;font-family:var(--f-kanji);font-weight:400;font-size:26px;line-height:1.15}
.appr-head p{margin:2px 0 0;font-size:12.5px;opacity:.8}

.toasts{position:absolute;top:calc(env(safe-area-inset-top,0px) + 70px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:40;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.toast{background:var(--ink);border:1px solid var(--gold);padding:9px 14px;border-radius:5px;font-size:13px;font-weight:700;animation:rise .2s ease-out;max-width:100%;text-align:center}
@media (prefers-reduced-motion:reduce){.card,.toast{animation:none}.mb.glow{animation:none}}

.act.wide{grid-column:span 2;flex-direction:row;justify-content:center;gap:10px}
.act.wide span{text-align:left}.act small{display:block;font-family:var(--f-body);font-size:10.5px;letter-spacing:0;text-transform:none;opacity:.75;font-weight:500}
.tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.tab{border:1.5px solid rgba(239,229,207,.18);border-radius:6px;background:rgba(0,0,0,.25);padding:6px 2px 5px;display:flex;flex-direction:column;align-items:center;font-size:10.5px;line-height:1.15;color:var(--washi);opacity:.8}
.tab b{font-family:var(--f-kanji);font-weight:400;font-size:19px;color:var(--ember2)}
.tab[aria-pressed=true]{border-color:var(--ember2);background:rgba(217,120,50,.18);opacity:1}
.sw{display:inline-block;width:16px;height:16px;border-radius:50%;border:1px solid rgba(255,255,255,.3);vertical-align:-3px;margin-right:4px;flex:none}
.sw.lg{width:26px;height:26px}
.opts.sm{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.opts.sm .opt b{font-size:16px;display:inline}
.opt[aria-pressed=true]{border-color:var(--ember2);background:rgba(217,120,50,.18)}
.kd-prev{padding:8px}.kd-prev canvas{width:100%;height:clamp(150px,34vw,230px);display:block;border-radius:6px}
.kd-name{display:flex;flex-direction:column}.kd-name b{font-family:var(--f-kanji);font-weight:400;font-size:20px}.kd-name span{font-size:12px;opacity:.8}
em.new{font-style:normal;color:#ffb35c;font-weight:700}
.mats{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px}.mats span{display:flex;align-items:center}.mats .no small{color:#ff9a7a}.mats small{margin-left:4px;opacity:.75}
.shop{display:flex;flex-direction:column;gap:8px}

  case 'vPrev':case 'vNext':{const n=viewList(VIEW.src).length;VIEW.i=(VIEW.i+(a==='vNext'?1:n-1))%n;VIEW.t=0;Snd.whoosh?Snd.whoosh():Snd.click();renderView();break;}

  case 'tkPutB':{const bl=S.blades.find(x=>x.id==id);if(!bl||S.disp.length>=dispSlots())break;S.blades=S.blades.filter(x=>x!==bl);S.disp.push(bl);save();Snd.good();closeModal();renderToko();break;}

  case 'tkOffB':{const bl=S.disp.find(x=>x.id==id);if(!bl||S.blades.length>=slots())break;S.disp=S.disp.filter(x=>x!==bl);S.blades.push(bl);save();closeModal();renderToko();break;}

/* ================= PRICING & ORDERS ================= */
function priceFor(type,score,hamon,koshi){const TY=byId(TYPES,type),H=byId(HAMONS,hamon)||HAMONS[0],K=byId(KOSHI,koshi)||KOSHI[0];return Math.round(TY.base*Math.pow(.35+score/100,2.3)*H.mult*K.mult*(1+.06*lv('store'))*(1+rankIdx()*.04));}
function genOrder(){const r=rankIdx(),pool=CUST.filter(c=>c.rank<=r);const c=pool[Math.floor(Math.pow(Math.random(),.7)*pool.length)];
 const types=c.types.filter(id=>byId(TYPES,id).rank<=r);const type=types.length?types[Math.floor(Math.random()*types.length)]:'tanto';
 const minG=Math.min(c.minG,Math.max(0,r+1));const hams=HAMONS.filter(h=>h.rank<=r);const hamon=c.hamon&&Math.random()<.7?hams[Math.floor(Math.random()*hams.length)].id:null;
 const cut=['samurai','hatamoto','daimyo','shogun'].includes(c.id)&&Math.random()<.55?clamp(2+Math.floor(r*.6)+(c.id==='shogun'?1:0),2,5):0;
 const ko=r>=1&&['merchant','nanban','daimyo','shogun'].includes(c.id)&&Math.random()<.35?Math.min(80,40+r*8):0;
 const mult=rnd(c.pay[0],c.pay[1])*(1+.08*cut)*(ko?1.15:1);const pay=Math.round(priceFor(type,GRADES[minG].min+8,hamon||'sugu','shira')*mult/5)*5;
 return{id:Date.now()+Math.random(),c:c.id,type,minG,hamon,cut,ko,pay,mult:Math.round(mult*100)/100,fame:Math.round(c.fame*(1+minG*.25))};}
const orderPay=(o,b)=>Math.round(Math.max(o.pay,b.price*(o.mult||1.2))*(1+kakuBonus()/100));
function fillOrders(){while(S.orders.length<orderSlots())S.orders.push(genOrder());}
const fits=(b,o)=>b.type===o.type&&b.grade>=o.minG&&(!o.hamon||b.hamon.style===o.hamon)&&(!o.cut||(b.cut||0)>=o.cut)&&(!o.ko||(b.koshi==='custom'&&kAvgQ(b)>=o.ko));
const FAME_X=3;
function addFame(n){const before=rankIdx();S.fame+=Math.round(n*FAME_X);const after=rankIdx();if(after>before)rankUp(after);}
function rankUp(r){Snd.fanfare();PF.happy();const un=[];[[TYPES,'type'],[HAMONS,'hamon'],[CONS,'cons'],[KOSHI,'koshi'],[SANDS,'sand'],[COALS,'coal'],[CUST,'cust']].forEach(([arr])=>arr.forEach(x=>{if(x.rank===r)un.push(L(x.name));}));
 setTimeout(()=>openModal(`<div class="card"><div class="bigk">${esc(RANKS[r].k)}</div><h3>${tx('Promoted','昇格')}<small>${esc(L(RANKS[r].name))}</small></h3><p>${tx('Your name spreads across the provinces. Newly available:','その名は諸国に広まった。新たに解放：')}</p><div class="how">${un.map(esc).join(' · ')||'—'}</div><div class="row end"><button class="btn go" data-act="closeModal">${tx('Continue','続ける')}</button></div></div>`),400);}

let SM={r:.7,coal:1.2,sand:'masa',ctype:'pine',free:false};

 const score=clamp(100-Math.abs(SM.r-ideal)*140-Math.abs(SM.coal-ci)*120+(SM.ctype==='chestnut'?4:0),15,100);
 const purity=lerp(ak.purity,pure.purity,SM.r),cost=Math.round(10*(ak.cost*(1-SM.r)+pure.cost*SM.r)+12*SM.coal*ct.cost);
 return{score,purity,cost:SM.free?0:cost,raw:cost,shift:(SM.r-.6)*80+(SM.sand==='izumo'?20:0)};}

 if(!byId(SANDS,SM.sand)||byId(SANDS,SM.sand).rank>r)SM.sand='masa';if(byId(COALS,SM.ctype).rank>r)SM.ctype='pine';

 <div class="board"><div class="meter"><span>${tx('Blend','調合の出来')}</span><div class="bar"><i id="m-b" style="width:${b.score}%"></i></div><b id="v-b">${Math.round(b.score)}</b><span>${tx('Purity','純度')}</span><div class="bar"><i id="m-p" style="width:${b.purity*100}%"></i></div><b id="v-p">${Math.round(b.purity*100)}</b></div>

 show('page');$('#scr-page').scrollTop=0;

function startSmelt(){const b=blend();if(S.money<b.cost){toast(tx('Not enough money for materials','材料代が足りません'));return;}

  lore:tx('For three days and nights, iron sand and charcoal are fed into a clay furnace while bellows roar. The bloom that forms at the bottom holds the precious tamahagane.','三日三晩、鞴で風を送りながら砂鉄と木炭を粘土の炉にくべ続ける。炉の底にできた鉧（けら）から玉鋼が取れる。'),

    openModal(`<div class="card"><div class="bigk">玉鋼</div><h3>${tx('Tamahagane ready','玉鋼が取れた')}<small>${tx('Steel quality','鋼の質')} ${Math.round(q0)}</small></h3><p>${tx('Hard steel (kawagane) for the skin, soft steel (shingane) for the core.','皮鉄は刃と外側に、心鉄は芯に使う。')}</p><div class="how">皮鉄 ×${nk} (${qk}) · 心鉄 ×${ns} (${qs})</div><div class="row end"><button class="btn go" data-act="home">${tx('Back to the forge','工房へ戻る')}</button></div></div>`);};
   if(lv('apprentice')>=1){toast(tx('Your apprentice sorted the steel','弟子が鋼を選り分けた'));done(.8);return;}

    how:tx('Sort each flake: fine sparkle = HARD, fibrous gray = SOFT, dark pits = SLAG.','細かく輝く＝皮鉄、繊維状の灰色＝心鉄、黒い穴＝滓。ボタンで選り分ける。')},(sc,ex)=>done(ex.acc!=null?ex.acc:sc/100));});
}

 show('page');
 $('#sl-f').addEventListener('input',e=>{FG.folds=+e.target.value;$('#v-f').textContent=FG.folds;$('#n-f').textContent=FG.folds<12?tx('Too few folds: impurities remain','少なすぎ：不純物が残る'):FG.folds>15?tx('Too many folds: the steel loses carbon','多すぎ：炭素が抜けて鋼が弱る'):tx('A good number of folds','ちょうど良い回数');});

 MG.run(MG_FOLD,{folds:W.folds},{k:'鍛錬',name:tx('Folding','折り返し鍛錬'),sub:tx('Forging the steel','鋼を鍛える'),step:1,total:n,

  case 'lang':LANG=LANG==='ja'?'en':'ja';S.lang=LANG;save();renderTitle();if(!$('#modal').hidden)openSettings();if(!$('#scr-home').hidden)renderHome();else if(!$('#scr-page').hidden)go(page);break;
 }});
$('#btnPlay').addEventListener('click',async()=>{Snd.init();Snd.click();await PF.ad('preroll');if(!S.name)askName(()=>go('home'));else go('home');});
const cvPos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];};
cv.addEventListener('pointerdown',e=>{Snd.init();const m=MG.cur;if(!m||!m.started||m.done)return;try{cv.setPointerCapture(e.pointerId);}catch(_){}const[x,y]=cvPos(e);m.down&&m.down(x,y);e.preventDefault();});
cv.addEventListener('pointermove',e=>{const m=MG.cur;if(!m||!m.started||m.done)return;const[x,y]=cvPos(e);m.move&&m.move(x,y);});
const pup=e=>{const m=MG.cur;if(!m||!m.started||m.done)return;const[x,y]=cvPos(e);m.up&&m.up(x,y);};cv.addEventListener('pointerup',pup);cv.addEventListener('pointercancel',pup);
window.addEventListener('keydown',e=>{const m=MG.cur;if(m&&m.started&&!m.done&&m.key){if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(!e.repeat)m.key(e.code,true);}});
window.addEventListener('keyup',e=>{const m=MG.cur;if(m&&m.key)m.key(e.code,false);});
document.addEventListener('visibilitychange',()=>{if(!Snd.ac)return;if(document.hidden)Snd.ac.suspend();else Snd.ac.resume();});

/* ================= LOOP ================= */
/* showcase: drawn sword + scabbard side by side on a diagonal (hilt up-right) */
function studioBg(c,W,H,cx,cy,R){let g=c.createLinearGradient(0,0,W,H);g.addColorStop(0,'#141a28');g.addColorStop(.55,'#07080d');g.addColorStop(1,'#0e1220');c.fillStyle=g;c.fillRect(0,0,W,H);
 const sp=c.createRadialGradient(cx,cy,10,cx,cy,R);sp.addColorStop(0,'rgba(170,185,235,.2)');sp.addColorStop(.55,'rgba(60,70,120,.07)');sp.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=sp;c.fillRect(0,0,W,H);}
function drawShowcase(c,b,cx,cy,T,a,t){const TY=byId(TYPES,b.type)||TYPES[2],tlr={tanto:.44,waki:.37,uchi:.33,tachi:.31}[TY.id]||.33,sori=(b.sori!=null?b.sori:TY.sori)*1.15;
 const L0=T/(1.08+tlr)*Math.min(1,.5+.5*TY.len/1.08),bw=TY.wid*.42*L0,Ws=TY.wid*L0*1.18*.5,ox=-(L0-tlr*L0)/2,kp=b.koshi==='custom'?b.kp:null,koshi=b.koshi||'kuro';
 c.save();c.translate(cx,cy);c.rotate(-a);c.scale(-1,1);
 // scabbard beside the blade
 drawSaya(c,ox+L0*.07,Ws*2.6,L0*.98,{type:b.type,sori,koshi,kp,only:'saya',real:true,time:t});
 // blade
 c.save();c.shadowColor='rgba(0,0,0,.7)';c.shadowBlur=24;c.shadowOffsetY=14;c.strokeStyle='rgba(0,0,0,.6)';c.lineWidth=bw*.6;c.beginPath();c.moveTo(ox,0);c.lineTo(ox+L0,arcY(1,L0,sori));c.stroke();c.restore();
 drawBlade(c,ox,-bw/2,L0,{type:b.type,sori,wm:.42,arc:true,polish:1,hamon:b.hamon,seed:b.seed,time:t,showNakago:false,shadow:false});
 {const G=bladeGeom(L0,sori,TY.wid*.42,true);c.save();c.translate(ox,-bw/2);poly(c,G.sp,G.ed);c.clip();c.globalCompositeOperation='lighter';
  const hx=((t*.2)%1.5-.25)*L0,hg=c.createLinearGradient(hx-L0*.1,0,hx+L0*.1,0);hg.addColorStop(0,'rgba(255,255,255,0)');hg.addColorStop(.5,'rgba(225,238,255,.6)');hg.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=hg;c.fillRect(hx-L0*.1,-L0,L0*.2,L0*2);
  c.strokeStyle='rgba(240,246,255,.4)';c.lineWidth=Math.max(1,bw*.07);c.beginPath();G.sp.forEach((q,i)=>{const yy=q[1]+(G.ed[i][1]-q[1])*.32;i?c.lineTo(q[0],yy):c.moveTo(q[0],yy);});c.stroke();c.restore();}
 // hilt + tsuba
 drawSaya(c,ox,0,L0*.98,{type:b.type,sori,koshi,kp,only:'hilt',real:true,time:t});
 c.restore();
 c.save();c.globalCompositeOperation='lighter';for(let i=0;i<3;i++){const k=((t*.16+i/3)%1),d=(k-.5)*T*.8,px=cx-Math.cos(a)*d,py=cy+Math.sin(a)*d,s=(1-Math.abs(k-.5)*2)*13;if(s<=1)continue;c.strokeStyle='rgba(220,235,255,.55)';c.lineWidth=1.4;c.beginPath();c.moveTo(px-s,py);c.lineTo(px+s,py);c.moveTo(px,py-s);c.lineTo(px,py+s);c.stroke();}c.restore();}
function showcaseFit(W,top,h){const land=W>h*1.5,a=land?.42:clamp(Math.atan2(h*.8,W*.85),.6,.95),T=Math.min(W*(land?.6:.96)/Math.cos(a),h*.8/Math.sin(a));return{a,T:land?T*.92:T,cx:W/2+(land?0:W*.02),cy:top+h*(land?.4:.45)};}
function drawAppr(time,dt){const c=ctx,W=VW,H=VH;
 if(!APPR){studioBg(c,W,H,W/2,H/2,Math.max(W,H)*.7);return;}APPR.t+=dt;if(!APPR.ph||APPR.pw!==W){APPR.ph=($('#appr').offsetHeight||H*.45)+24;APPR.pw=W;}
 const r0=Math.max(56,H*.07),rH=Math.max(160,H-APPR.ph-r0),f=showcaseFit(W,r0,rH);studioBg(c,W,H,f.cx,f.cy,Math.max(W,rH)*.75);drawShowcase(c,APPR.b,f.cx,f.cy,f.T,f.a,APPR.t);drawP();}
/* viewer for finished works */
let VIEW=null;
function viewList(src){return src==='store'?S.blades:src==='disp'?S.disp:S.registry;}
function openView(src,i,back){const list=viewList(src);if(!list.length)return;VIEW={src,i:clamp(i,0,list.length-1),back,t:0};scene='view';renderView();show('view');}
function renderView(){const list=viewList(VIEW.src),b=list[VIEW.i];if(!b){closeView();return;}const TY=byId(TYPES,b.type),H=byId(HAMONS,b.hamon.style),G=GRADES[b.grade]||GRADES[0];
 const ko=b.koshi==='custom'?tx('Custom mounting','自作の拵え'):L((byId(KOSHI,b.koshi||'kuro')||KOSHI[0]).name);
 $('#view').innerHTML=`<div class="view-top"><button class="iconbtn" data-act="vClose" aria-label="${tx('Close','閉じる')}">✕</button><span>${VIEW.i+1} / ${list.length}</span></div>
 <div class="view-bot"><button class="vnav" data-act="vPrev" aria-label="${tx('Previous','前へ')}" ${list.length<2?'disabled':''}>‹</button>
 <div class="vcap">${gradeChip(b.grade)}<b>${esc(TY.k)}　${esc(H.k)}　${esc(b.mei||'')}</b><span>${esc(L(G.name||{en:'',ja:''}))} · ${tx('Score','総合')} ${b.score} · ${esc(ko)}${b.cutMei?' · '+esc(b.cutMei):''}</span></div>
 <button class="vnav" data-act="vNext" aria-label="${tx('Next','次へ')}" ${list.length<2?'disabled':''}>›</button></div>`;}
function closeView(){const back=VIEW&&VIEW.back;VIEW=null;go(back||'home');}
function drawView(time,dt){const c=ctx,W=VW,H=VH;if(!VIEW)return;VIEW.t+=dt;const b=viewList(VIEW.src)[VIEW.i];
 const top=64,h=H-top-(W>H?110:150),f=showcaseFit(W,top,h);studioBg(c,W,H,f.cx,f.cy,Math.max(W,h)*.8);if(b)drawShowcase(c,b,f.cx,f.cy,f.T,f.a,VIEW.t);}
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const time=now/1000;
 ctx.setTransform(DPR,0,0,DPR,0,0);
 if(!PF.paused){MG.update(dt);stepP(dt);}
 if(MG.cur)MG.draw(time,dt);else if(scene==='appr')drawAppr(time,dt);else if(scene==='toko')drawToko(time,dt);else if(scene==='view')drawView(time,dt);else drawWorkshop(time,dt);
 requestAnimationFrame(frame);}
async function boot(){resize();await PF.init();loadSave();Snd.muted=S.muted;renderTitle();show('title');PF.loadingStop();requestAnimationFrame(frame);
 if(/[?&]debug=1/.test(location.search))window.__kf={get S(){return S;},MG,MG_CLAY,PF,go,appr:b=>showAppraisal(b),auto(sc){const m=MG.cur;if(!m)return;if(m===MG_CLAY){for(let i=0;i<m.B;i++)m.prof[i]=m.guide((i+.5)/m.B);m.tryDone(true);}else if(m===MG_QUENCH){m.T=800+(100-sc)/2;m.quench();}else if(m===MG_FOLD)MG.finish(sc,{avg:sc,folds:m.opts.folds});else if(m===MG_SORT)MG.finish(sc,{acc:sc/100});else MG.finish(sc,{});}};}
boot();

})();
