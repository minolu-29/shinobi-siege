<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Shinobi Siege</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600&family=Yuji+Boku&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed canvas battlefield; menus are washi-paper scrolls floating over an indigo night sky */
:root{
  --ai:#121831; --ai2:#1d2548; --ai3:#2c3668;
  --kin:#e3b54a; --kin2:#f5dc94;
  --shu:#cf3b2a; --shu-dk:#7e2116;
  --washi:#efe4cb; --washi2:#e0d0ad; --sumi:#1c1814; --sumi2:#5d5244;
  --ok:#5f9e5a;
  --f-disp:'Teko','Arial Narrow',Impact,sans-serif;
  --f-brush:'Yuji Boku','Hiragino Mincho ProN','Yu Mincho',serif;
  --f-body:'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ai);color:var(--washi)}
body{font:14px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0;overflow:hidden;background:var(--ai)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:2px solid var(--kin);outline-offset:2px}
button:disabled{cursor:default}

.screen{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding-block:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 28px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* title */
#scr-title{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;gap:10px;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 7vh)}
.logo{position:relative;display:flex;flex-direction:column;align-items:center}
.logo-k{font-family:var(--f-brush);font-size:clamp(130px,40vw,230px);line-height:.85;color:var(--washi);text-shadow:0 8px 0 rgba(0,0,0,.35)}
.logo-seal{position:absolute;right:-6px;top:58%;background:var(--shu);color:var(--washi);writing-mode:vertical-rl;font-family:var(--f-brush);font-size:15px;letter-spacing:.15em;padding:8px 4px;border-radius:3px;transform:rotate(4deg);box-shadow:0 3px 0 var(--shu-dk)}
.logo-en{font-family:var(--f-disp);font-weight:600;font-size:clamp(52px,15vw,88px);line-height:.8;letter-spacing:.08em;color:var(--kin);margin-top:10px;text-wrap:balance}
@media (max-height:620px){.logo-k{font-size:min(23vh,40vw)}.logo-seal{font-size:11px;padding:6px 3px;right:-30px;top:30%;white-space:nowrap}.logo-en{font-size:min(12vh,15vw);margin-top:4px}#scr-title{gap:6px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 3vh)}}
.logo-ja{font-family:var(--f-brush);font-size:19px;letter-spacing:.35em;opacity:.85}
.tagline{font-size:14px;opacity:.85;max-width:30ch;text-wrap:balance}
.howto{font-size:12px;opacity:.6;max-width:36ch;text-wrap:balance}
.title-row{display:flex;gap:10px;align-items:center;margin-top:4px}
.btn-primary{font-family:var(--f-disp);font-weight:600;font-size:32px;line-height:1;letter-spacing:.14em;padding:12px 48px 6px;background:var(--shu);color:var(--washi);border-radius:4px;box-shadow:0 4px 0 var(--shu-dk),0 12px 26px rgba(0,0,0,.45)}
.btn-primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shu-dk)}
.chip{font-size:13px;padding:8px 14px;border-radius:999px;background:rgba(239,228,203,.1);border:1px solid rgba(239,228,203,.2)}

/* top bar */
.topbar{display:flex;align-items:center;gap:12px}
.lvl{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.lvl-num{font-family:var(--f-disp);font-weight:600;font-size:36px;line-height:.8;color:var(--kin);padding-top:6px}
.lvl-num small{font-size:16px;letter-spacing:.08em;color:var(--washi);opacity:.7;margin-right:2px}
.xp{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.xpbar{height:6px;background:rgba(239,228,203,.14);border-radius:3px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--kin),var(--kin2))}
.xp span{font-size:11px;opacity:.6;font-variant-numeric:tabular-nums}
.purse{display:flex;align-items:center;gap:6px;font-family:var(--f-disp);font-size:24px;line-height:1;padding-top:4px;font-variant-numeric:tabular-nums}
.coin{display:inline-block;width:15px;height:15px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fff0b8,var(--kin) 55%,#9b6f18);position:relative;vertical-align:-2px;margin-top:-4px}
.coin::after{content:"";position:absolute;left:5px;top:5px;width:5px;height:5px;background:rgba(20,16,10,.65)}
.iconbtn{width:40px;height:40px;border-radius:50%;background:rgba(239,228,203,.09);display:grid;place-items:center;font-family:var(--f-brush);font-size:17px;flex:none}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.navbtn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:6px;background:var(--ai2);border:1px solid rgba(227,181,74,.25);text-align:left}
.navbtn b{font-family:var(--f-brush);font-weight:400;font-size:24px;color:var(--kin);line-height:1}
.navbtn span{font-family:var(--f-disp);font-size:22px;letter-spacing:.05em;line-height:1;padding-top:4px}
.navbtn em{font-style:normal;font-size:11px;background:var(--shu);color:var(--washi);border-radius:999px;padding:1px 7px;margin-left:auto}
.h-sec{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.h-sec h2{margin:0;font-family:var(--f-disp);font-weight:500;font-size:28px;letter-spacing:.06em;line-height:1}
.h-sec span{font-family:var(--f-brush);color:var(--kin);font-size:16px}

/* washi card */
.paper{background:var(--washi);color:var(--sumi);border-radius:6px;box-shadow:0 10px 22px rgba(0,0,0,.35);
  background-image:repeating-linear-gradient(97deg,rgba(120,90,40,.035) 0 2px,transparent 2px 7px),repeating-linear-gradient(8deg,rgba(120,90,40,.03) 0 1px,transparent 1px 11px)}
.vcard{display:grid;grid-template-columns:58px minmax(0,1fr);gap:10px 12px;padding:12px;position:relative}
.mon{width:58px;height:58px;border-radius:50%;background:var(--sumi);display:grid;place-items:center;font-family:var(--f-brush);font-size:27px;color:var(--acc,var(--kin));box-shadow:inset 0 0 0 3px var(--sumi),inset 0 0 0 4px var(--acc,var(--kin))}
.vtitle{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.vname{font-family:var(--f-disp);font-weight:600;font-size:28px;line-height:.9;letter-spacing:.03em;padding-top:4px}
.vk{font-family:var(--f-brush);font-size:15px;color:var(--sumi2)}
.vmeta{font-size:12px;color:var(--sumi2);line-height:1.45}
.vmeta b{color:var(--sumi);font-weight:700}
.stages{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stg{border:1.5px solid var(--sumi);border-radius:4px;padding:6px 4px 5px;display:flex;flex-direction:column;align-items:center;color:var(--sumi);background:rgba(255,255,255,.25)}
.stg .n{font-family:var(--f-brush);font-size:21px;line-height:1.1}
.stg .l{font-size:11px;line-height:1.2;text-align:center}
.stg.cleared{background:var(--sumi);color:var(--kin2)}
.stg.boss .n::after{content:"城";font-size:11px;margin-left:3px;color:var(--shu);vertical-align:3px}
.stg:disabled{opacity:.32}
.vcard.locked .mon,.vcard.locked .stages{filter:grayscale(1);opacity:.45}
.lockrow{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px dashed rgba(28,24,20,.3);padding-top:9px}
.lockrow .msg{font-size:12.5px;font-weight:700}
.btn-buy{background:var(--shu);color:var(--washi);border-radius:4px;padding:8px 14px;font-weight:700;font-size:13px;box-shadow:0 3px 0 var(--shu-dk)}
.btn-buy:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shu-dk)}
.btn-ink{background:var(--sumi);color:var(--kin2);border-radius:4px;padding:8px 14px;font-weight:700;font-size:13px}
.btn-ghost{border:1.5px solid var(--sumi);border-radius:4px;padding:7px 13px;font-weight:700;font-size:13px;color:var(--sumi)}
.btn-ink:disabled,.btn-ghost:disabled{opacity:.4}

/* armory */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--ai2);padding:5px;border-radius:8px}
.tab{padding:8px 4px 6px;border-radius:5px;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.tab b{font-family:var(--f-brush);font-weight:400;font-size:20px}
.tab span{font-size:11px;opacity:.75}
.tab[aria-selected="true"]{background:var(--washi);color:var(--sumi)}
.item{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px 12px;padding:12px}
.ik{width:52px;height:52px;border-radius:6px;background:var(--sumi);color:var(--kin2);display:grid;place-items:center;font-family:var(--f-brush);font-size:26px;position:relative}
.ik i{position:absolute;right:-6px;bottom:-6px;font-style:normal;font-family:var(--f-disp);font-size:16px;line-height:1;background:var(--shu);color:var(--washi);border-radius:3px;padding:3px 5px 0}
.iname{font-family:var(--f-disp);font-weight:600;font-size:24px;line-height:.9;padding-top:4px}
.iname small{font-family:var(--f-brush);font-weight:400;font-size:14px;color:var(--sumi2);margin-left:6px}
.idesc{font-size:12px;color:var(--sumi2);margin-top:2px}
.stats{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:12px}
.stats span{font-variant-numeric:tabular-nums}
.stats b{font-weight:700}
.iact{grid-column:1/-1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px dashed rgba(28,24,20,.3);padding-top:9px}
.cost{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;font-variant-numeric:tabular-nums;margin-right:auto;align-items:center}
.cost span{display:inline-flex;align-items:center;gap:4px}
.cost .short{color:var(--shu);font-weight:700}
.mk{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:3px;background:var(--sumi);color:var(--mc,#ccc);font-family:var(--f-brush);font-size:11px;line-height:1}
.tag-eq{font-size:12px;font-weight:700;color:var(--ok);margin-right:auto}

/* materials */
.mats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mat{padding:12px;display:flex;gap:10px;align-items:center}
.mat .mk{width:40px;height:40px;font-size:22px;border-radius:6px;flex:none}
.mat b{font-family:var(--f-disp);font-size:30px;line-height:.8;padding-top:5px;display:block;font-variant-numeric:tabular-nums}
.mat span{font-size:12px;color:var(--sumi2);line-height:1.3;display:block}
.note{font-size:12.5px;opacity:.75;text-align:center;padding:4px 8px;text-wrap:balance}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none}
.hud-top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:center}
.hp{flex:1;max-width:260px;height:16px;background:rgba(10,10,20,.6);border-radius:3px;border:1.5px solid rgba(239,228,203,.5);overflow:hidden;position:relative}
.hp i{position:absolute;inset:0;transform-origin:left;background:linear-gradient(180deg,#e45a46,var(--shu));transition:transform .12s}
.hp span{position:absolute;inset:0;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums}
.quota{font-family:var(--f-disp);font-size:22px;line-height:1;padding:6px 10px 2px;background:rgba(10,10,20,.55);border-radius:4px;font-variant-numeric:tabular-nums;margin-left:auto;white-space:nowrap}
.quota small{font-size:14px;opacity:.7;margin-right:4px;letter-spacing:.05em}
#btnPause{pointer-events:auto;width:40px;height:40px;border-radius:50%;background:rgba(10,10,20,.55);display:grid;place-items:center;flex:none}
#btnPause::before{content:"";width:12px;height:14px;border-left:4px solid var(--washi);border-right:4px solid var(--washi)}
.bossbar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 60px);left:50%;transform:translateX(-50%);width:min(420px,calc(100% - 32px));text-align:center}
.bossbar span{font-family:var(--f-disp);font-size:20px;letter-spacing:.06em;text-shadow:0 2px 3px #000}
.bossbar div{height:10px;background:rgba(10,10,20,.7);border:1.5px solid var(--kin);border-radius:2px;overflow:hidden}
.bossbar i{display:block;height:100%;width:100%;background:var(--kin);transform-origin:left}
.jutsu{pointer-events:auto;position:absolute;right:calc(max(16px,env(safe-area-inset-right,0px)) + 6px);bottom:calc(env(safe-area-inset-bottom,0px) + 26px);width:86px;height:86px;border-radius:50%;
  background:var(--shu);box-shadow:0 5px 0 var(--shu-dk),0 10px 24px rgba(0,0,0,.5),inset 0 0 0 4px var(--shu),inset 0 0 0 6px rgba(239,228,203,.55);display:grid;place-items:center;overflow:hidden}
.jutsu b{font-family:var(--f-brush);font-weight:400;font-size:40px;color:var(--washi);position:relative;z-index:1;line-height:1}
.jutsu::after{content:"";position:absolute;inset:0;background:conic-gradient(rgba(8,10,24,.72) calc(var(--cd,0) * 1turn),transparent 0)}
.jutsu.ready{animation:pulse 1.4s ease-in-out infinite}
.jutsu.s2,.jutsu.s3{width:62px;height:62px}
.jutsu.s2{right:calc(max(16px,env(safe-area-inset-right,0px)) + 104px);bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
.jutsu.s3{bottom:calc(env(safe-area-inset-bottom,0px) + 126px)}
.jutsu.s2 b,.jutsu.s3 b{font-size:28px}
.jutsu.combo{width:72px;height:72px;right:calc(max(16px,env(safe-area-inset-right,0px)) + 96px);bottom:calc(env(safe-area-inset-bottom,0px) + 104px);background:var(--kin);box-shadow:0 5px 0 #8a6a1d,0 10px 24px rgba(0,0,0,.5),inset 0 0 0 4px var(--kin),inset 0 0 0 6px rgba(28,24,20,.45)}
.jutsu.combo b{color:var(--sumi);font-size:34px}
.elb{font-style:normal;font-family:var(--f-brush);font-size:13px;background:var(--sumi);color:var(--ec);border-radius:3px;padding:2px 5px 1px;margin-left:6px;vertical-align:4px}
.vcard.ura{background:#1b1428;background-image:radial-gradient(120% 90% at 85% 0%,rgba(183,124,255,.28),transparent 60%);color:var(--washi);border:1px solid rgba(183,124,255,.6);box-shadow:0 0 24px rgba(183,124,255,.25),0 10px 22px rgba(0,0,0,.4)}
.vcard.ura .vname{color:#e3ccff}.vcard.ura .vk,.vcard.ura .vmeta{color:#c9b8e6}.vcard.ura .vmeta b{color:#fff}
.vcard.ura .mon{background:#0c0814;color:#c99bff;box-shadow:inset 0 0 0 3px #0c0814,inset 0 0 0 4px #b77cff}
.btn-ura{grid-column:1/-1;background:#6b2fb3;color:#fff;border-radius:4px;padding:11px;font-family:var(--f-disp);font-size:24px;letter-spacing:.1em;line-height:1;box-shadow:0 3px 0 #3c1670,0 0 18px rgba(183,124,255,.45)}
.combo-note{padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.combo-note b{font-family:var(--f-disp);font-size:24px;font-weight:600;line-height:.9;padding-top:3px}
@keyframes pulse{50%{box-shadow:0 5px 0 var(--shu-dk),0 0 0 8px rgba(227,181,74,.35),inset 0 0 0 4px var(--shu),inset 0 0 0 6px rgba(239,228,203,.55)}}
.hint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 140px);transform:translateX(-50%);font-size:14px;font-weight:700;background:rgba(10,10,20,.6);padding:8px 14px;border-radius:999px;white-space:nowrap;transition:opacity .5s}
.banner{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none;opacity:0;transition:opacity .35s}
.banner.show{opacity:1}
.banner b{display:block;font-family:var(--f-brush);font-weight:400;font-size:clamp(46px,13vw,86px);line-height:1;color:var(--washi);text-shadow:0 4px 0 rgba(0,0,0,.5),0 0 30px rgba(0,0,0,.6)}
.banner span{display:inline-block;margin-top:8px;font-family:var(--f-disp);font-size:24px;letter-spacing:.08em;background:var(--shu);padding:6px 14px 1px;border-radius:2px}

/* modal */
.modal{position:absolute;inset:0;background:rgba(6,8,20,.72);display:grid;place-items:center;z-index:20;
  padding-block:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-y:auto}
.sheet{width:100%;max-width:420px;padding:20px 18px 16px;display:flex;flex-direction:column;gap:12px;animation:rise .25s ease-out}
@keyframes rise{from{transform:translateY(14px);opacity:.4}}
.sheet h3{margin:0;font-family:var(--f-disp);font-weight:600;font-size:30px;line-height:.9;padding-top:4px;letter-spacing:.03em}
.sheet h3 small{display:block;font-family:var(--f-brush);font-weight:400;font-size:15px;color:var(--sumi2);margin-top:4px}
.order{font-family:var(--f-brush);font-size:16px;line-height:1.6;border-left:3px solid var(--shu);padding:2px 0 2px 12px;margin:0}
.order cite{display:block;font-style:normal;font-family:var(--f-body);font-size:12px;color:var(--sumi2);margin-top:6px}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.row .btn-buy,.row .btn-ink,.row .btn-ghost{padding:11px 16px;font-size:14px}
.price{font-family:var(--f-disp);font-size:44px;line-height:.8;padding-top:8px;color:var(--shu)}
.small{font-size:12px;color:var(--sumi2)}
.big-k{font-family:var(--f-brush);font-size:84px;line-height:1;text-align:center;margin:-6px 0 -4px}
.big-k.win{color:var(--shu)} .big-k.lose{color:var(--sumi2)}
.rw{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;font-variant-numeric:tabular-nums;font-size:14px;font-weight:700}
.rw span{display:inline-flex;align-items:center;gap:5px}
.lvup{background:var(--sumi);color:var(--kin2);border-radius:5px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:3px}
.lvup b{font-family:var(--f-disp);font-size:26px;line-height:.9;padding-top:3px;font-weight:600}

.toast-host{position:absolute;top:calc(env(safe-area-inset-top,0px) + 64px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:30;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.toast{background:var(--sumi);color:var(--washi);border:1px solid var(--kin);padding:9px 14px;border-radius:5px;font-size:13px;font-weight:700;animation:rise .2s ease-out;max-width:100%;text-align:center}

@media (prefers-reduced-motion:reduce){.jutsu.ready{animation:none}.sheet,.toast{animation:none}}
</style>
</head>
<body>

<div id="app">
  <canvas id="cv"></canvas>

  <section class="screen" id="scr-title">
    <div class="logo">
      <div class="logo-k">忍</div>
      <div class="logo-seal">国落とし</div>
    </div>
    <div class="logo-en">SHINOBI SIEGE</div>
    <div class="logo-ja">忍び国落とし</div>
    <p class="tagline" data-t="tagline"></p>
    <div class="title-row">
      <button class="btn-primary" id="btnPlay" data-t="play"></button>
    </div>
    <div class="title-row">
      <button class="chip" data-act="lang" id="langChip"></button>
      <button class="chip" data-act="sound" id="soundChip"></button>
    </div>
    <p class="howto" data-t="howto"></p>
  </section>

  <section class="screen" id="scr-map" hidden></section>
  <section class="screen" id="scr-armory" hidden></section>

let WX=[],wxType='';
function setWeather(type){
 wxType=type;WX=[];const n={petals:36,leaves:24,maple:30,snow:70,rain:90,embers:46,fireflies:30,mist:9}[type]||0;
 for(let i=0;i<n;i++)WX.push(newWx(true));
}
function newWx(init){
 const x=Math.random()*VW,y=init?Math.random()*VH:-20;
 switch(wxType){
  case 'rain':return{x,y,vx:-120,vy:rnd(700,900),s:rnd(10,18)};
  case 'snow':return{x,y,vx:rnd(-15,15),vy:rnd(25,60),s:rnd(1.2,3.2),p:Math.random()*6};
  case 'shade':
  case 'embers':return{x,y:init?Math.random()*VH:VH+10,vx:rnd(-20,20),vy:-rnd(30,80),s:rnd(1.2,2.8),p:Math.random()*6};
  case 'fireflies':return{x,y:Math.random()*VH,vx:0,vy:0,s:rnd(1.5,2.6),p:Math.random()*6};
  case 'mist':return{x:init?Math.random()*VW:-300,y:Math.random()*VH,vx:rnd(8,20),vy:0,s:rnd(140,260)};
  default:return{x,y,vx:rnd(15,45),vy:rnd(30,60),s:rnd(3,5.5),r:Math.random()*6,vr:rnd(-2,2),p:Math.random()*6};
 }
}
function stepWx(dt,time){
 for(let i=0;i<WX.length;i++){const w=WX[i];
  if(wxType==='fireflies'){w.p+=dt;w.x+=Math.cos(w.p*.7+i)*14*dt;w.y+=Math.sin(w.p*.9+i*2)*12*dt;}
  else{w.x+=w.vx*dt+(w.r!==undefined?Math.sin(time*1.5+w.p)*12*dt:0);w.y+=w.vy*dt;if(w.r!==undefined)w.r+=w.vr*dt;}
  if(w.y>VH+30||w.x<-320||w.x>VW+320||((wxType==='embers'||wxType==='shade')&&w.y<-20))WX[i]=newWx(false);
 }
}

/* ================= PROGRESSION ================= */
function addXp(n){
 const before=S.lvl;S.xp+=n;while(S.xp>=needXp(S.lvl)&&S.lvl<60){S.xp-=needXp(S.lvl);S.lvl++;}
 if(S.lvl===before)return null;
 const free=[],early=[];
 VILLAGES.forEach(v=>{if(v.req>before&&v.req<=S.lvl)free.push(v.k+(LANG==='ja'?'の里':' · '+v.en));else if(!S.paid['v_'+v.id]&&half(v.req)>before&&half(v.req)<=S.lvl&&S.lvl<v.req)early.push(v.k+(LANG==='ja'?'の里':' · '+v.en));});
 Object.values(ALLGEAR).forEach(g=>{if(S.own[g.id]||g.need||g.ura)return;if(g.req>before&&g.req<=S.lvl)free.push(L(g.name));else if(half(g.req)>before&&half(g.req)<=S.lvl&&S.lvl<g.req)early.push(L(g.name));});
 return{from:before,to:S.lvl,free,early};
}
function rollMats(vi,si){
 const v=VILLAGES[vi],m={iron:2+Math.floor(Math.random()*3)+Math.floor(vi/2),tama:0,scroll:0,spirit:0};
 if(si===2)m.tama+=1+Math.floor(vi/3);else if(Math.random()<.25)m.tama+=1;
 if(si===1)m.scroll+=1+Math.floor(vi/3);else if(Math.random()<.45)m.scroll+=1;
 if(vi>=2&&Math.random()<.35)m.spirit+=1;
 m[v.spec]+=2+Math.floor(vi/2);
 for(const k in m)if(!m[k])delete m[k];return m;
}
let lastResult=null;
function finishRun(){
 const r=run;mode='result';Snd.mode='menu';$('#hud').hidden=true;joy.on=false;
 const key=r.v.id+'-'+r.si,first=r.win&&!S.clear[key];
 let gold,xp,mats={};
 if(r.win){gold=r.gold+60+r.vi*45+r.si*25;xp=r.xp+50+r.vi*45+r.si*20;mats=rollMats(r.vi,r.si);if(first){xp=Math.round(xp*1.5);gold=Math.round(gold*1.5);}S.clear[key]=true;}
 else{gold=Math.floor(r.gold*.5);xp=Math.floor(r.xp*.5);}
 S.gold+=gold;for(const k in mats)S.mats[k]=(S.mats[k]||0)+mats[k];
 const lv=addXp(xp);save();
 let curse=false;if(r.win&&r.v.hidden&&!S.own.j11){S.own.j11=1;curse=true;save();}
 lastResult={win:r.win,gold,xp,mats,lv,first,doubled:false,curse};
 showResult();
}
function showResult(){
 const R=lastResult;
 const mats=Object.keys(R.mats).map(k=>`<span><i class="mk" style="--mc:${MATS[k].c}">${MATS[k].k}</i>×${R.mats[k]}</span>`).join('');
 let lv=R.curse?`<div class="lvup" style="background:#2a1440;color:#e3ccff"><b>呪</b>${esc(t('curseGot'))}</div>`:'';if(R.lv){lv+=lv=`<div class="lvup"><b>${esc(t('levelUp',{n:R.lv.to}))}</b>${R.lv.free.length?`<div>${esc(t('nowOpen'))}: ${R.lv.free.map(esc).join(', ')}</div>`:''}${R.lv.early.length&&IAP()?`<div>${esc(t('earlyOpen'))}: ${R.lv.early.map(esc).join(', ')}</div>`:''}</div>`;}
 openModal(`<div class="sheet paper">
  <div class="big-k ${R.win?'win':'lose'}">${R.win?'勝':'敗'}</div>
  <h3 style="text-align:center">${esc(t(R.win?'victory':'defeat'))}<small>${R.win?(R.first?esc(t('firstClear')):''):esc(t('defeatSub'))}</small></h3>
  <div class="rw"><span><i class="coin"></i>+${R.gold}</span><span>${esc(t('exp'))} +${R.xp}</span>${mats}</div>
  ${lv}
  <div class="row">${R.win&&!R.doubled&&BUILD!=='web'?`<button class="btn-ghost" data-act="double">${esc(t('double'))}</button>`:''}<button class="btn-ink" data-act="toMap">${esc(t('cont'))}</button></div>
 </div>`);
}

function closeModal(){$('#modal').hidden=true;$('#modal').innerHTML='';}
function toast(s){const el=document.createElement('div');el.className='toast';el.textContent=s;$('#toasts').appendChild(el);setTimeout(()=>el.remove(),2600);}
function purse(){return `<div class="purse"><i class="coin"></i>${S.gold}</div>`;}
function topbar(back){
 const need=needXp(S.lvl);
 return `<div class="topbar">${back?`<button class="iconbtn" data-act="toMap" aria-label="${esc(t('back'))}">戻</button>`:''}
  <div class="lvl"><div class="lvl-num"><small>LV</small>${S.lvl}</div><div class="xp"><div class="xpbar"><i style="width:${Math.min(100,S.xp/need*100)}%"></i></div><span>${S.xp} / ${need} ${esc(t('exp'))}</span></div></div>
  ${purse()}<button class="iconbtn" data-act="settings" aria-label="Settings">設</button></div>`;
}
function claimCount(){let n=0;Object.values(ALLGEAR).forEach(g=>{if(!S.own[g.id]&&gOK(g))n++;});return n;}
function renderMap(){
 const el=$('#scr-map');const cc=claimCount();
 let h=`<div class="wrap">${topbar(false)}
  <div class="nav"><button class="navbtn" data-act="armory"><b>武</b><span>${esc(t('armory'))}</span>${cc?`<em>${cc}</em>`:''}</button><button class="navbtn" data-act="mats"><b>材</b><span>${esc(t('materials'))}</span></button></div>
  <div class="h-sec"><h2>${esc(t('villages'))}</h2><span>十の里</span></div>`;
 VILLAGES.forEach((v,i)=>{
  if(v.hidden){if(!allMax()&&!S.clear['ura-2'])return;if(!S.uraSeen){S.uraSeen=true;save();setTimeout(()=>toast(t('uraAppear')),300);}
   h+=`<article class="paper vcard ura"><div class="mon">裏</div><div><div class="vtitle"><span class="vname">${esc(t('uraTitle'))}</span><span class="vk">${esc(L(v.target))}</span></div><div class="vmeta">${esc(t('uraMeta'))}${S.clear['ura-2']?' ・ <b>✓</b>':''}</div></div><button class="btn-ura" data-act="stage" data-v="${i}" data-s="2">${esc(t('uraGo'))}</button></article>`;return;}
  const open=vOpen(i),th=THEMES[v.theme];
  const big=LANG==='ja'?v.k+'の里':v.en,small=LANG==='ja'?v.en:v.k+'の里';
  h+=`<article class="paper vcard ${open?'':'locked'}" style="--acc:${th.acc}">
   <div class="mon">${v.k.length>1?v.k[0]:v.k}</div>
   <div><div class="vtitle"><span class="vname">${esc(big)}</span><span class="vk">${esc(small)}</span></div>
   <div class="vmeta">${esc(t('target'))}: <b>${esc(L(v.target))}</b><br>${esc(t('orders'))}: ${esc(L(v.lord))}</div></div>
   <div class="stages">${[0,1,2].map(si=>{const c=!!S.clear[v.id+'-'+si],ok=sOpen(i,si);return `<button class="stg ${c?'cleared':''} ${si===2?'boss':''}" data-act="stage" data-v="${i}" data-s="${si}" ${ok?'':'disabled'}><span class="n">${['一','二','三'][si]}</span><span class="l">${esc(t('stage')[si])}</span></button>`;}).join('')}</div>`;
  if(!open){const hh=half(v.req);
   h+=`<div class="lockrow"><span class="msg">${esc(t('needLv',{n:v.req}))}</span>${!IAP()?'':S.lvl>=hh?`<button class="btn-buy" data-act="buyV" data-v="${i}">${esc(t('unlockNow'))} · ${money(v.price)}</button>`:`<span class="small">${esc(t('earlyAt',{n:hh}))}</span>`}</div>`;}
  h+=`</article>`;
 });
 h+=`</div>`;el.innerHTML=h;
}
let armTab='katana';
function costOf(g,u){const c=costOf0(g,u);for(const k in c.mats)c.mats[k]=c.mats[k]>0?Math.max(1,Math.round(c.mats[k]*.8)):0;return c;}
function costOf0(g,u){const cat=g.cat,tr=g.tier;return{gold:40*tr*u,mats:cat==='katana'?{iron:2*u+tr,tama:Math.max(0,u-2)}:cat==='shuriken'?{iron:2*u+tr,spirit:Math.max(0,u-3)}:{scroll:u+tr,spirit:Math.max(0,u-2)}};}
function afford(c){if(S.gold<c.gold)return false;for(const k in c.mats)if((S.mats[k]||0)<c.mats[k])return false;return true;}
function statLine(g,u){
 const m=mult(u||1);
 if(g.cat==='katana')return `<span>${esc(t('dmg'))} <b>${Math.round(g.dmg*m)}</b></span><span>${esc(t('reach'))} <b>${g.range}</b></span><span>${esc(t('rate'))} <b>${(1/g.cd).toFixed(1)}</b></span>`;
 if(g.cat==='shuriken')return `<span>${esc(t('dmg'))} <b>${Math.round(g.dmg*m)}</b></span><span>${esc(t('stars'))} <b>${g.n}</b></span>${g.pierce?`<span>${esc(t('pierce'))} <b>${g.pierce>9?'∞':g.pierce}</b></span>`:''}`;
 return `${g.dmg?`<span>${esc(t('dmg'))} <b>${Math.round(g.dmg*m)}</b></span>`:''}<span>${esc(t('cd'))} <b>${g.cd}s</b></span>${(ex=>ex?`<span>${esc(ex[0])} <b>${ex[1]}</b></span>`:'')({fire:[t('burn'),'2s'],bolt:[t('para'),'1.5s'],water:[t('soak'),'3s'],earth:[t('knock'),'1s'],metal:[t('brk'),'3s'],multi:[t('bodies'),'5'],summon:[t('summon'),'5s'],curse:[t('dur'),'15s'],wind:[t('deflect'),''],smoke:[t('hide'),'3s'],clone:[t('clones'),(u||1)>=5?'3':'2']}[g.type])}`;
}
function renderArmory(){
 const el=$('#scr-armory');const slot={katana:'k',shuriken:'s',jutsu:'js'}[armTab],isJ=armTab==='jutsu';
 let h=`<div class="wrap">${topbar(true)}
  <div class="tabs" role="tablist">${[['katana','刀'],['shuriken','剣'],['jutsu','術']].map(([c,k])=>`<button class="tab" role="tab" aria-selected="${armTab===c}" data-act="tab" data-c="${c}"><b>${k}</b><span>${esc(t(c))}</span></button>`).join('')}</div>`;
 if(isJ){const js=pStats().js,C=computeCombo(js);h+=`<div class="paper combo-note"><b>${esc(t('combo'))}</b><span>${C?esc(t('comboReady',{n:L(C.name)}))+' · '+esc(t(C.size===3?'power3':'power2')):esc(t('comboHint'))}</span><span class="small">${esc(t('jslots'))} ${esc(t('slots'))}: ${js.map(J=>J.g.k+'+'+J.ju).join('　')||'—'}（${js.length}/3）</span></div>`;}
 GEAR[armTab].forEach(g=>{
  if(g.secret&&!S.own[g.id]&&!allMax()&&!S.clear['ura-2'])return;
  const u=S.own[g.id]||0,eq=isJ?S.eq.js.includes(g.id):S.eq[slot]===g.id;
  h+=`<article class="paper item"><div class="ik">${g.k}${u?`<i>+${u}</i>`:''}</div>
   <div><div class="iname">${esc(L(g.name))}${g.el?`<em class="elb" style="--ec:rgb(${ELEM[g.el].c})">${ELEM[g.el].k}</em>`:''}<small>${esc(LANG==='ja'?g.name.en:g.name.ja)}</small></div><div class="idesc">${esc(L(g.desc))}</div><div class="stats">${statLine(g,u||1)}</div></div>
   <div class="iact">`;
  if(u){
   if(u<MAXUP){const c=costOf(g,u);h+=`<div class="cost"><span class="${S.gold<c.gold?'short':''}"><i class="coin"></i>${c.gold}</span>${Object.keys(c.mats).filter(k=>c.mats[k]>0).map(k=>`<span class="${(S.mats[k]||0)<c.mats[k]?'short':''}"><i class="mk" style="--mc:${MATS[k].c}">${MATS[k].k}</i>${S.mats[k]||0}/${c.mats[k]}</span>`).join('')}</div>
     <button class="btn-ghost" data-act="up" data-id="${g.id}" ${afford(c)?'':'disabled'}>${esc(t('upgrade'))}</button>`;}
   else h+=`<span class="cost">${esc(t('maxed'))}</span>`;
   if(isJ)h+=eq?`<span class="tag-eq">${esc(t('equipped'))}</span><button class="btn-ghost" data-act="unequip" data-id="${g.id}">${esc(t('unequip'))}</button>`:(S.eq.js.length>=3?`<button class="btn-ink" disabled>${esc(t('slotsFull'))}</button>`:`<button class="btn-ink" data-act="equip" data-id="${g.id}">${esc(t('equip'))}</button>`);
   else h+=eq?`<span class="tag-eq">${esc(t('equipped'))}</span>`:`<button class="btn-ink" data-act="equip" data-id="${g.id}">${esc(t('equip'))}</button>`;
  }else if(g.ura&&!gOK(g)){h+=`<span class="cost">${esc(t('uraLock'))}</span>`;}
  else if(g.need&&!gOK(g)){h+=`<span class="cost">${esc(t('mastery',{a:L(ALLGEAR[g.need[0]].name),b:L(ALLGEAR[g.need[1]].name)}))}<br>${g.need.map(id=>ALLGEAR[id].k+' +'+(S.own[id]||0)+'/'+MAXUP).join(' · ')}</span>`;}
  else if(gOK(g)){h+=`<span class="cost">${esc(t('nowOpen'))}</span><button class="btn-ink" data-act="claim" data-id="${g.id}">${esc(t('claim'))}</button>`;}
  else if(IAP()&&!g.need&&!g.ura&&S.lvl>=half(g.req)){h+=`<span class="cost">${esc(t('needLv',{n:g.req}))}</span><button class="btn-buy" data-act="buyG" data-id="${g.id}">${esc(t('unlockNow'))} · ${money(g.price)}</button>`;}
  else h+=`<span class="cost">${esc(t('needLv',{n:g.req}))}${IAP()?' · '+esc(t('earlyAt',{n:half(g.req)})):''}</span>`;
  h+=`</div></article>`;
 });
 h+=`</div>`;el.innerHTML=h;
}
function renderMats(){
 const el=$('#scr-mats');
 el.innerHTML=`<div class="wrap">${topbar(true)}<div class="h-sec"><h2>${esc(t('materials'))}</h2><span>素材</span></div>
  <div class="mats">${Object.keys(MATS).map(k=>`<div class="paper mat"><i class="mk" style="--mc:${MATS[k].c}">${MATS[k].k}</i><div><b>${S.mats[k]||0}</b><span style="color:var(--sumi);font-weight:700">${esc(L(MATS[k].name))}</span><span>${esc(L(MATS[k].desc))}</span></div></div>`).join('')}</div>
  <p class="note">${esc(t('trade'))}</p></div>`;
}
function openBriefing(vi,si){
 const v=VILLAGES[vi];
 openModal(`<div class="sheet paper">
  <h3>${v.hidden?esc(t('uraTitle')):esc(t('stage')[si])} · ${esc(L(v.target))}<small>${v.hidden?esc(t('uraMeta')):esc(v.k)+'の里 · '+['一','二','三'][si]}</small></h3>
  <blockquote class="order">${esc(L(v.order))}<cite>${esc(t('orders'))}: ${esc(L(v.lord))}</cite></blockquote>
  <div class="row"><button class="btn-ghost" data-act="close">${esc(t('cancel'))}</button><button class="btn-buy" data-act="go" data-v="${vi}" data-s="${si}">${esc(t('begin'))}</button></div></div>`);
}
let pendingBuy=null;
function openBuy(kind,ref){
 const isV=kind==='v',it=isV?VILLAGES[ref]:ALLGEAR[ref];
 const name=isV?(LANG==='ja'?it.k+'の里':it.en+' Village'):L(it.name);
 pendingBuy={kind,ref,sku:(isV?'unlock_village_':'unlock_gear_')+(isV?it.id:it.id),price:it.price,name};
 openModal(`<div class="sheet paper">
  <h3>${esc(t('buyTitle'))}<small>${esc(name)}</small></h3>
  <div class="price">${money(it.price)}</div>
  <p class="small" style="margin:0">${esc(t('buyBody',{req:it.req,lvl:S.lvl}))}</p>
  ${SDKW.sdk?'':`<p class="small" style="margin:0">${esc(t('testNote'))}</p>`}
  <div class="row"><button class="btn-ghost" data-act="close">${esc(t('cancel'))}</button><button class="btn-buy" data-act="confirmBuy">${esc(t('buy',{p:money(it.price)}))}</button></div></div>`);
}
async function confirmBuy(){
 const b=pendingBuy;if(!b)return;const res=await SDKW.purchase(b.sku);
 if(res==='ok'||res==='demo'){if(b.kind==='v')S.paid['v_'+VILLAGES[b.ref].id]=true;else{S.paid['g_'+b.ref]=true;S.own[b.ref]=1;}save();closeModal();toast(t('unlocked',{n:b.name}));refresh();Snd.win();}
 else if(res==='signin'){toast(t('signin'));}
 else if(res==='unavailable'){closeModal();toast(t('iapOff'));}
 else if(res==='error'){toast(t('buyFail'));}
 pendingBuy=null;
}
function openSettings(){
 openModal(`<div class="sheet paper"><h3>${esc(LANG==='ja'?'設定':'Settings')}</h3>
  <div class="row" style="justify-content:flex-start"><button class="btn-ghost" data-act="sound">${esc(t('sound'))}: ${esc(t(S.muted?'off':'on'))}</button><button class="btn-ghost" data-act="lang">${esc(t('langSwitch'))}</button></div>
  <div class="row"><button class="btn-ink" data-act="close">${esc(t('back'))}</button></div></div>`);
}
function openPause(){
 if(!run||run.done)return;run.paused=true;joy.on=false;SDKW.playStop();
 openModal(`<div class="sheet paper"><h3>${esc(t('paused'))}<small>${esc(t('stage')[run.si])} · ${esc(L(run.v.target))}</small></h3>
  <div class="row" style="justify-content:flex-start"><button class="btn-ghost" data-act="sound">${esc(t('sound'))}: ${esc(t(S.muted?'off':'on'))}</button></div>
  <div class="row"><button class="btn-ghost" data-act="retreat">${esc(t('retreat'))}</button><button class="btn-buy" data-act="resume">${esc(t('resume'))}</button></div></div>`);
}
function resume(){if(!run)return;closeModal();run.paused=false;SDKW.playStart();}
function refresh(){if(!$('#scr-map').hidden)renderMap();if(!$('#scr-armory').hidden)renderArmory();if(!$('#scr-mats').hidden)renderMats();renderTitle();}
const KB=()=>{try{return matchMedia('(pointer:fine)').matches&&!('ontouchstart' in window);}catch(e){return false;}};
function renderTitle(){document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t==='howto'&&KB()?'howtoKb':el.dataset.t));$('#langChip').textContent=t('langSwitch');$('#soundChip').textContent=t('sound')+': '+t(S.muted?'off':'on');document.documentElement.lang=LANG;}
function goMap(){run=null;mode='menu';Snd.mode='menu';setWeather('petals');renderMap();showScreen('map');closeModal();}

document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-act]');if(!b||b.disabled)return;if(b.closest('#modal')&&performance.now()-modalAt<600)return;Snd.init();Snd.click();
 const a=b.dataset.act;
 switch(a){
  case 'stage':openBriefing(+b.dataset.v,+b.dataset.s);break;
  case 'go':closeModal();startStage(+b.dataset.v,+b.dataset.s);break;
  case 'close':closeModal();break;
  case 'armory':renderArmory();showScreen('armory');break;
  case 'mats':renderMats();showScreen('mats');break;
  case 'toMap':
   if(mode==='result'){closeModal();await SDKW.ad('midgame');}
   goMap();break;
  case 'tab':armTab=b.dataset.c;renderArmory();break;
  case 'equip':{const g=ALLGEAR[b.dataset.id];if(g.cat==='jutsu'){if(!S.eq.js.includes(g.id)&&S.eq.js.length<3)S.eq.js.push(g.id);}else S.eq[{katana:'k',shuriken:'s'}[g.cat]]=g.id;save();renderArmory();break;}
  case 'unequip':{S.eq.js=S.eq.js.filter(id=>id!==b.dataset.id);save();renderArmory();break;}
  case 'claim':{const g=ALLGEAR[b.dataset.id];S.own[g.id]=1;if(g.cat==='jutsu'){if(S.eq.js.length<3)S.eq.js.push(g.id);}else{const sl={katana:'k',shuriken:'s'}[g.cat];if(!S.eq[sl])S.eq[sl]=g.id;}save();toast(t('unlocked',{n:L(g.name)}));renderArmory();break;}
  case 'up':{const g=ALLGEAR[b.dataset.id],u=S.own[g.id],c=costOf(g,u);if(!afford(c)){toast(t('noMats'));break;}S.gold-=c.gold;for(const k in c.mats)S.mats[k]-=c.mats[k];S.own[g.id]=u+1;save();toast(t('upgraded',{n:L(g.name),u:u+1}));renderArmory();break;}
  case 'buyV':openBuy('v',+b.dataset.v);break;
  case 'buyG':openBuy('g',b.dataset.id);break;
  case 'confirmBuy':confirmBuy();break;
  case 'settings':openSettings();break;
  case 'sound':S.muted=!S.muted;Snd.setMuted(S.muted);save();renderTitle();if(!$('#modal').hidden){if(run&&run.paused)openPause();else openSettings();}break;
  case 'lang':LANG=LANG==='ja'?'en':'ja';S.lang=LANG;save();renderTitle();refresh();if(!$('#modal').hidden&&!run)openSettings();break;
  case 'resume':resume();break;
  case 'retreat':closeModal();run.paused=false;run.done=true;SDKW.playStop();goMap();break;
  case 'double':{const r=await SDKW.ad('rewarded');if(r==='ok'||r==='demo'){if(r==='demo')toast(t('adTest'));const R=lastResult;S.gold+=R.gold;for(const k in R.mats)S.mats[k]+=R.mats[k];R.gold*=2;for(const k in R.mats)R.mats[k]*=2;R.doubled=true;save();showResult();toast(t('doubled'));}else toast(LANG==='ja'?'広告を読み込めませんでした。あとでもう一度お試しください。':'The ad could not load. Please try again later.');break;}
 }
});
$('#btnPlay').addEventListener('click',()=>{Snd.init();Snd.click();if(!S.clear['iga-0'])startStage(0,0);else goMap();});
$('#btnPause').addEventListener('click',()=>openPause());
document.querySelectorAll('[data-slot]').forEach(b=>b.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();Snd.init();castJutsu(+b.dataset.slot);}));
$('#btnCombo').addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();Snd.init();castCombo();});
cv.addEventListener('pointerdown',e=>{Snd.init();if(mode!=='play'||!run||run.paused||run.done)return;joy.on=true;joy.id=e.pointerId;joy.ox=joy.x=e.clientX;joy.oy=joy.y=e.clientY;try{cv.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();});
cv.addEventListener('pointermove',e=>{if(joy.on&&e.pointerId===joy.id){joy.x=e.clientX;joy.y=e.clientY;}});
const endJoy=e=>{if(e.pointerId===joy.id)joy.on=false;};cv.addEventListener('pointerup',endJoy);cv.addEventListener('pointercancel',endJoy);
window.addEventListener('keydown',e=>{Snd.init();keys[e.code]=true;if(mode==='play'){if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(e.code==='Space'||e.code==='Digit1'||e.code==='KeyJ')castJutsu(0);if(e.code==='Digit2'||e.code==='KeyK')castJutsu(1);if(e.code==='Digit3'||e.code==='KeyL')castJutsu(2);if(e.code==='KeyC'||e.code==='Digit4')castCombo();if(e.code==='Escape'||e.code==='KeyP'){if(run&&run.paused)resume();else openPause();}}});
window.addEventListener('keyup',e=>{keys[e.code]=false;});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;joy.on=false;});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(mode==='play'&&run&&!run.paused&&!run.done)openPause();if(Snd.ac)Snd.ac.suspend();}else if(Snd.ac&&Snd.ac.state==='suspended')Snd.ac.resume();});

/* ================= LOOP ================= */
let last=performance.now();
function frame(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;const time=now/1000;
 stepWx(dt,time);
 if(mode==='play'||(mode==='result'&&run)){
  if(run&&!run.paused&&mode==='play')update(dt);
  if(run){draw(time);if(mode==='play')hud();}
 }else drawMenu(time);
 requestAnimationFrame(frame);
}

if(/[?&]debug=1/.test(location.search))window.__ss={get run(){return run;},get S(){return S;},get mode(){return mode;}};
async function boot(){
 resize();
 await SDKW.init();
 loadSave();Snd.muted=S.muted;
 renderTitle();setWeather('petals');
 SDKW.loadingStop();
 showScreen('title');
 requestAnimationFrame(frame);
}
boot();
})();
</script>
</body>
</html>
